# GENFORGE — NGINX reverse proxy (place in /etc/nginx/sites-available/genforge)
# Serves: app pages, Streamlit's _stcore endpoints, AND WebSockets (required).
# Replace app.example.com with your real domain, then:
#   sudo ln -s /etc/nginx/sites-available/genforge /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS redirect (enable once your certificate is issued)
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # Let's Encrypt webroot challenge works over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    # Certbot-managed paths (adjust if you use other certificates)
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Streamlit serves large rendered media — allow big uploads (matches
    # server.maxUploadSize=512 in the container entrypoint)
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket upgrade — Streamlit WILL NOT WORK without these two lines
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # Long-running video renders must not be buffered to disk
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
